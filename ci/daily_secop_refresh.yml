name: Daily SECOP II Refresh & Deploy

on:
  schedule:
    # Runs everyday at 11:00 UTC (06:00 AM Colombia time / COT UTC-5)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  harvest-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harvest and enrich live SECOP II data
        run: |
          python -m src.export_prospects

      - name: Commit and push updated datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/data.js
          if git diff --staged --quiet; then
            echo "No changes in SECOP II dataset today."
          else
            git commit -m "chore(data): auto-update SECOP II opportunities [skip ci]"
            git push
          fi
