name: Daily SECOP II Refresh & Deploy

# Los datos ya no se versionan en main: el sitio se publica desde un artefacto (GitHub Pages
# con "GitHub Actions" como fuente). El estado de la corrida anterior se descarga del sitio
# publicado, así que cada publicación lleva consigo lo que necesita la siguiente.
on:
  schedule:
    # Runs everyday at 11:00 UTC (06:00 AM Colombia time / COT UTC-5)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  # Un merge a main publica el código nuevo con los datos ya publicados, sin consultar SECOP.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Dos corridas a la vez competirían por la misma publicación.
concurrency:
  group: daily-secop-refresh
  cancel-in-progress: false

env:
  SITE_URL: https://andres-solanor.github.io/secop-opportunities-engine
  # Todo lo que publica el pipeline. Los cinco .json son el estado que lee la corrida siguiente
  # (src/export_prospects.py, state_dir); el resto se necesita para publicar sin correr el pipeline.
  DATA_FILES: >-
    prospects.json paa.json perfil_proponente.json seen_ids.json sync_history.json
    prospects.csv prospects_summary.md hidden_summary.md
  WEB_FILES: data.js hidden.js

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run tests before touching published data
        run: |
          python -m unittest discover tests

      # Si el sitio no responde, la corrida se detiene y queda publicado lo de ayer: con un
      # estado viejo, "nuevas" y "salidas" saldrían mal.
      - name: Restore the published data (state of the previous run)
        run: |
          set -euo pipefail
          for f in $DATA_FILES; do curl -fsSL --retry 3 "$SITE_URL/data/$f" -o "data/$f"; done
          for f in $WEB_FILES; do curl -fsSL --retry 3 "$SITE_URL/web/$f" -o "web/$f"; done

      - name: Harvest and enrich live SECOP II data
        if: github.event_name != 'push'
        run: |
          python -m src.export_prospects

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web data _site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
